<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="012_CSSProject.css" />
    <title>Coffee Masters</title>
</head>
<body>
    <section class="cm-container">
        <div class="banner"><img class = "coffee-masters-logo" src="coffee_masters_logo.png"
             alt="coffee masters cup image" /> Coffee Masters</div>
        <div class="checkout-container">
            <div class="items">
                ITEMS
                <p class="first-item">Cappuccino</p>
                    <p class="quantity">1x</p>
                        <p class="extras">Lite foam</p>
                <p class="second-item">Cappuccino</p>
                    <p class="quantity">1x</p>
                        <p class="extras">Lite milk</p>
                        <p class="extras">Double espresso</p>
                <p class="third-item">Croissant</p>
                    <p class="quantity">1x</p>
                        <p class="extras">Butter</p>
            </div>

            <form class="name">
                <p class="name-for-order">Name for order</p>
            </form>

            <form class="payment">
                Payment
                <p class="card-number">Card number</p>
                <p class="cvv">CVV Number</p>
            </form>

            <div class="subtotal">Subtotal: <p class="subtotal-price"> $9.65</p></div>
            
            <div class="tax">Tax:
                <p class="tax-price">$0.82</p>
            </div>
            <div class="total">Total:
                <p class="total-price">$10.47</p>
            </div>
            <div class="place-order">Place Order</div>

        </div>

    </section>
</body>
</html>
