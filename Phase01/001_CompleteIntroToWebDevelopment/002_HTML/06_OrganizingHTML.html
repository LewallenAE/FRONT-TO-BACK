<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>

    <!-- Labeling is very important -->

    <!-- This is a reusable structure -->
    
    <div class="social-post"> <!-- This might not be the best tag for separation, sections are usually better.-->
        <h2 class="username">@mr_boom_bostick</h2>
        <h3 class="posted-date">Posted 2y ago</h3>

        alt="A picture of a cartoon bomb smiling wearing a hoodie with fire in the background"/>

    <!--Structure a navigation bar -->

    <nav>

            </li>
            <li class="nav-list-item">

    <!-- For no bullets -->

    <nav>
        <ul style="list-style-type: none" class="nav-list">
            <li class="nav-list-item">
                <a class="nav-link" href="/">Home</a>
            </li>
            <li class="nav-list-item">
                <a class="nav-link" href="/About">About</a>

            <li class="nav-list-item">
